name: Bug report
description: Report something that is not working
labels:
- bug
body:
- type: textarea
  id: what
  attributes:
    label: What happened?
    description: Describe the bug and what you expected instead.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Numbered steps, as exact as possible.
  validations:
    required: true
- type: input
  id: browser
  attributes:
    label: Browser and version
    description: e.g. Chromium 130, Firefox 132.
  validations:
    required: true
- type: input
  id: env
  attributes:
    label: Operating system
    description: e.g. Ubuntu 24.04, Windows 11.
  validations:
    required: false
- type: input
  id: vcd
  attributes:
    label: VCD source and size
    description: Simulator that wrote the dump (iverilog/Verilator/Questa version) and approximate file size.
  validations:
    required: false
- type: input
  id: commit
  attributes:
    label: Commit
    description: Output of `git rev-parse --short HEAD`.
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Logs or output
    description: Paste relevant output. It will be formatted as code. Remove personal data first.
    render: shell
  validations:
    required: false
